[project]
authors = [{name = "walcark", email = "kevin.walcarius@cnes.fr"}]
dependencies = ["django>=5.2,<7", "gunicorn"]
name = "leefanniv"
description = "Team scoring across games during a party"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/leefanniv"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
django = ">=5.2,<7"
gunicorn = "*"

[tool.pixi.pypi-dependencies]
leefanniv = { path = ".", editable = true }

[tool.pixi.tasks]
manage = "python manage.py"
makemigrations = "python manage.py makemigrations leefanniv"
migrate = "python manage.py migrate --noinput"
runserver = "python manage.py runserver"
# Production entry point, used by the systemd unit (deploy/leefanniv.service).
# LEEFANNIV_BIND comes from its env file.
serve = { cmd = "gunicorn leefanniv.wsgi --workers 2 --bind $LEEFANNIV_BIND", depends-on = ["migrate"] }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-django = "*"

[tool.pixi.feature.dev.tasks]
fmt = "ruff format ."
lint = "ruff check src tests"
type-check = "mypy src"
test = "pytest -q"
all = { depends-on = ["fmt", "lint", "type-check", "test"] }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".pixi", "src/leefanniv/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "leefanniv.settings"
